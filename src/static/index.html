<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atrasmon</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">atras<span>mon</span></div>
  <div id="host-info" class="host-info">connecting…</div>
  <div id="conn" class="conn-dot" title="connection status"></div>
</header>

<main>
  <section class="panel" id="panel-cpu">
    <h2>CPU <span id="cpu-total" class="metric"></span></h2>
    <div class="gauge"><div id="cpu-bar" class="gauge-fill"></div></div>
    <canvas id="cpu-spark" height="40"></canvas>
    <div id="cores" class="cores"></div>
    <div id="load" class="subline"></div>
  </section>

  <section class="panel" id="panel-mem">
    <h2>Memory <span id="mem-label" class="metric"></span></h2>
    <div class="gauge"><div id="mem-bar" class="gauge-fill"></div></div>
    <canvas id="mem-spark" height="40"></canvas>
    <div id="swap" class="subline"></div>
  </section>

  <section class="panel" id="panel-net">
    <h2>Network <span id="net-total" class="metric"></span></h2>
    <canvas id="net-spark" height="40"></canvas>
    <table id="net-table"></table>
  </section>

  <section class="panel" id="panel-disks">
    <h2>Disks</h2>
    <div id="disks"></div>
  </section>

  <section class="panel" id="panel-diskio" hidden>
    <h2>Disk I/O</h2>
    <table id="diskio-table"></table>
  </section>

  <section class="panel" id="panel-sensors" hidden>
    <h2>Sensors</h2>
    <div id="temps"></div>
    <div id="fans" class="subline"></div>
  </section>

  <section class="panel wide" id="panel-procs">
    <h2>Processes <span id="proc-total" class="metric"></span>
      <span class="tabs">
        <button id="tab-cpu" class="tab active">by CPU</button>
        <button id="tab-mem" class="tab">by MEM</button>
      </span>
    </h2>
    <table id="proc-table"></table>
  </section>

  <section class="panel wide" id="panel-docker" hidden>
    <h2>Docker</h2>
    <table id="docker-table"></table>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
