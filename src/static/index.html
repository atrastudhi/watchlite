<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watchlite</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">watch<span>lite</span></div>
  <div id="host-info" class="host-info">connecting&hellip;</div>
  <div id="alerts" class="alert-chip" hidden></div>
  <div id="clock" class="clock"></div>
  <div id="conn" class="conn-dot" title="connection status"></div>
</header>

<main>
  <div class="row">
    <section class="panel" id="panel-cpu">
      <div class="panel-head">
        <h2>CPU</h2>
        <span id="load" class="head-dim"></span>
        <span id="cpu-total" class="head-val"></span>
      </div>
      <div class="chart">
        <canvas id="cpu-chart"></canvas>
        <span id="cpu-max" class="chart-max">100%</span>
      </div>
      <div id="cores" class="cores"></div>
      <div id="cpu-model" class="subline"></div>
    </section>

    <section class="panel" id="panel-mem">
      <div class="panel-head">
        <h2>Memory</h2>
        <span class="spacer"></span>
        <span id="mem-label" class="head-val"></span>
      </div>
      <div class="chart">
        <canvas id="mem-chart"></canvas>
        <span id="mem-max" class="chart-max">100%</span>
      </div>
      <div class="bar-line">
        <span class="bar-line-label">swap</span>
        <div class="bar"><div id="swap-bar" class="bar-fill dim"></div></div>
        <span id="swap-label" class="bar-line-val"></span>
      </div>
    </section>

    <section class="panel" id="panel-net">
      <div class="panel-head">
        <h2>Network</h2>
        <span class="spacer"></span>
        <span id="net-rx" class="head-val rx"></span>
        <span id="net-tx" class="head-val tx"></span>
      </div>
      <div class="chart">
        <canvas id="net-chart"></canvas>
        <span id="net-max" class="chart-max"></span>
      </div>
      <div id="net-table" class="gt gt-net"></div>
    </section>
  </div>

  <div class="row">
    <section class="panel" id="panel-disks">
      <h2>Disks</h2>
      <div id="disks" class="stack"></div>
    </section>

    <section class="panel" id="panel-diskio">
      <h2>Disk I/O</h2>
      <div id="diskio-table" class="gt gt-io"></div>
      <div id="diskio-na" class="na" hidden>not supported on this platform</div>
    </section>

    <section class="panel" id="panel-sensors" hidden>
      <h2>Sensors</h2>
      <div id="temps" class="stack"></div>
      <div id="fans" class="subline"></div>
    </section>

    <section class="panel" id="panel-conns">
      <h2>Connections</h2>
      <div id="conns-body">
        <div class="conn-stats">
          <div class="conn-stat"><span id="conn-est" class="conn-num"></span><span class="conn-cap">established</span></div>
          <div class="conn-stat"><span id="conn-tw" class="conn-num dim"></span><span class="conn-cap">time-wait</span></div>
        </div>
        <div class="conn-cap listen-cap">listening</div>
        <div id="listen-ports" class="ports"></div>
      </div>
      <div id="conns-na" class="na" hidden>not supported on this platform</div>
    </section>
  </div>

  <div class="row grow">
    <section class="panel wide7" id="panel-procs">
      <div class="panel-head">
        <h2>Processes</h2>
        <span id="proc-total" class="head-dim"></span>
        <span class="spacer"></span>
        <span id="state-filter" class="state-filter"></span>
        <span class="head-hint">click headers to sort</span>
      </div>
      <div class="gt gt-proc">
        <div class="gt-head" id="proc-head">
          <span class="num sortable" data-sort="pid">pid<i id="arr-pid"></i></span>
          <span class="sortable" data-sort="name">name<i id="arr-name"></i></span>
          <span>state</span>
          <span class="num sortable" data-sort="cpu">cpu%<i id="arr-cpu"></i></span>
          <span class="num sortable" data-sort="mem">mem<i id="arr-mem"></i></span>
        </div>
        <div id="proc-rows" class="gt-body"></div>
      </div>
    </section>

    <section class="panel wide5" id="panel-docker" hidden>
      <div class="panel-head">
        <h2>Docker</h2>
        <span id="docker-total" class="head-dim"></span>
      </div>
      <div class="gt gt-docker">
        <div class="gt-head">
          <span>name</span><span>image</span><span>state</span><span class="num">cpu%</span><span class="num">mem</span>
        </div>
        <div id="docker-rows" class="gt-body"></div>
      </div>
    </section>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
