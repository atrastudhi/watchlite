[package]
name = "watchlite"
version = "0.9.0"
edition = "2021"
description = "Ultra-lightweight single-binary server monitor with embedded web dashboard"
license = "MIT"
repository = "https://github.com/atrastudhi/watchlite"
keywords = ["monitoring", "server", "dashboard", "metrics", "lightweight"]
categories = ["command-line-utilities", "visualization"]
rust-version = "1.95"  # floor set by sysinfo; enforced by the msrv CI job
# keep the published crate tiny — assets and CI configs live in the repo only
exclude = ["assets/", ".github/", "Dockerfile", ".dockerignore", "CLAUDE.md"]

[dependencies]
tiny_http = "0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
