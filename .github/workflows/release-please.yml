name: release-please

# Maintains a "Release PR" that accumulates version bump + changelog from
# conventional commits. Merging that PR creates the tag and GitHub release,
# then builds and attaches the binaries via the release workflow.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: rust

  # GITHUB_TOKEN-created tags don't fire tag-push workflows, so call the
  # binary build directly when a release was just created.
  binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
