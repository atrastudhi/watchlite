name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Heads up: watchlite stays deliberately small — no heavy dependencies,
        binary under 1 MiB (see CONTRIBUTING.md). Features needing large
        platform libraries are usually out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation where you missed this feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Rough ideas welcome.
    validations:
      required: true
