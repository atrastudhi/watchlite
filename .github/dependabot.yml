version: 2
updates:
  # Dependency updates ship in the binary, so merging one should release:
  # the fix(deps) prefix makes the pipeline cut a patch version.
  # Minor/patch bumps arrive grouped in one PR; majors (e.g. sysinfo 0.x
  # jumps, which are breaking) stay separate for individual review.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "fix(deps)"
    groups:
      compatible:
        update-types: ["minor", "patch"]
  # Workflow actions don't ship to users; no release needed. All bumps in
  # one PR — separate PRs from one base conflict on the same file.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
